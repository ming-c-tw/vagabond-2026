<style>
:root{

  --c3:#b46ac9; --b3:#866692; --c4:#3dab6b; --b4:#4c8962; --c5:#e5752c; --b5:#8d6845; --c6:#3a55b8; --b6:#5a689c;
  --ppm:1.8px; /* 每分鐘高度 */
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:hidden}
body{background:var(--bg) radial-gradient(circle at 20% 0,#3a2a22 0,transparent 45%) fixed;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background:repeating-conic-gradient(from 0deg at 50% 0,#fff 0 3deg,transparent 3deg 12deg);}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
header{text-align:center;padding:10px 0 6px;position:relative}
.logo{font-family:Bungee,sans-serif;font-size:clamp(19px,6.4vw,48px);color:var(--gold);letter-spacing:1px;
  text-shadow:3px 3px 0 #b8322c,6px 6px 0 #1b6f78;line-height:1}
.logo small{display:block;font-size:.55em;margin-top:4px}
.sub{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}
.tabs{display:flex;gap:10px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.tab{font:inherit;cursor:pointer;border:3px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;
  padding:8px 16px;font-weight:900;font-size:15px}
.tab b{font-family:Bungee,sans-serif;font-weight:400;margin-right:6px}
.tab[aria-selected=true]{background:var(--gold);color:#3a1c12}
.legend{display:flex;justify-content:center;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin:6px 0 12px;flex-wrap:wrap}
.legend .chip{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--gold);box-shadow:0 0 8px 2px var(--gold)}
@media (min-width:761px){.legend .pinch{display:none}}
.legend button{font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid #6b5e52;border-radius:999px;padding:3px 10px;cursor:pointer}
.legend button[aria-pressed=true]{color:#3a1c12;background:var(--gold);border-color:var(--gold)}
.scroller{border-radius:14px}
.board{background:#161312;border:3px solid #6b4a2f;border-radius:14px;padding:10px 6px 14px}
.heads,.grid{display:grid;grid-template-columns:44px repeat(7,1fr) 44px;gap:0}
.heads > div{text-align:center;padding:4px 2px 10px}
.heads .zh{font-weight:900;font-size:26px;line-height:1.1;-webkit-text-stroke:1px rgba(0,0,0,.35)}
.heads .en{font-family:Bungee,sans-serif;font-size:11px;line-height:1.15;opacity:.95;margin-top:3px}
.grid{position:relative}
.tcol{position:relative}
.tcol span{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:700;transform:translateY(-50%);color:var(--ink)}
.col{position:relative;border-left:1px solid rgba(0,0,0,.35)}
.lines{position:absolute;inset:0;pointer-events:none}
.lines div{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.lines div.half{border-top:1px dashed var(--dash)}
.blk{position:absolute;left:4px;right:4px;border-radius:7px;padding:3px 4px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;color:#fff;border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 0 rgba(0,0,0,.35);
  font-weight:900;line-height:1.15;overflow:hidden;transition:transform .12s, box-shadow .2s}
button.blk{font:inherit;font-weight:900;cursor:pointer}
button.blk:hover,button.blk:focus-visible{transform:scale(1.04);z-index:3;outline:none}
.blk .nm{font-size:15px;word-break:break-word}
.blk.small .nm{font-size:10px}
.blk.long .nm{font-size:12.5px}
.blk .ft{display:block;font-size:10px;font-weight:700;opacity:.95}
.blk .tm{font-size:10.5px;font-weight:500;margin-top:2px;opacity:.95}
.blk.off{cursor:default;opacity:.92}
.blk.want{border-color:#fff6c9;box-shadow:0 0 0 2px var(--gold),0 0 18px 6px rgba(242,193,78,.85);animation:glow 1.6s ease-in-out infinite;z-index:2}
.blk.want::after{content:"★";position:absolute;top:1px;right:4px;font-size:12px;color:#fff6c9}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--gold),0 0 28px 10px rgba(242,193,78,.55)}}
.dim .blk:not(.want){opacity:.25;filter:saturate(.4)}
.views{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.views button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);background:none;border:1px solid #6b5e52;border-radius:8px;padding:5px 14px}
.views button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.list{display:none;gap:8px}
.mode-list .scroller{display:none}.mode-list .list{display:grid}
.slot{color:var(--gold);font-family:Bungee,sans-serif;font-size:15px;margin:10px 2px 0}
.row{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);

.row .nm{font-weight:900;font-size:16px;word-break:break-word}
.row .tm{font-size:12px;color:var(--muted)}
.row .star{font-size:18px;color:#6b5e52}
.row.want{border-color:var(--gold);box-shadow:0 0 14px 2px rgba(242,193,78,.55)}
.row.want .star{color:var(--gold)}
.dim .row:not(.want){opacity:.3}
@media (max-width:760px){
  .wrap{padding:12px}
}
footer{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 30px}
/* 彈窗 */
dialog{border:none;padding:0;background:transparent;max-width:min(640px,calc(100vw - 20px));width:100%;max-height:calc(100dvh - 20px)}
.card{max-height:calc(100dvh - 20px);overflow:auto}
dialog::backdrop{background:rgba(10,6,4,.72)}
.card{background:var(--bg2);color:var(--ink);border-radius:16px;border:3px solid var(--sc,#888);overflow:hidden}
.card-h{padding:14px 16px 10px;background:var(--sc);position:relative}
.card-h h2{margin:0;font-size:22px;font-weight:900;padding-right:36px;word-break:break-word}
.card-h p{margin:4px 0 0;font-size:13px;opacity:.95}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.25);color:#fff;font-size:20px;cursor:pointer}
.acts{display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap}
.acts button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:8px 16px;border:2px solid var(--gold);background:transparent;color:var(--gold)}
.acts .wantbtn[aria-pressed=true]{background:var(--gold);color:#3a1c12;box-shadow:0 0 14px 3px rgba(242,193,78,.6)}
.player{margin:10px 16px 0;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:none}
.player.on{display:block}
.player iframe{width:100%;height:100%;border:0}
ol.vids{list-style:none;margin:0;padding:10px 16px 16px;display:grid;gap:8px}
.vid{display:grid;grid-template-columns:28px 120px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.05);border-radius:10px;padding:6px;cursor:pointer;border:2px solid transparent}
.vid:hover,.vid.playing{border-color:var(--sc)}
.vid .rk{font-family:Bungee,sans-serif;color:var(--gold);text-align:center;font-size:18px}
.vid img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:#000}
.vid .tt{font-size:13.5px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .vw{font-size:12px;color:var(--muted);margin-top:3px}
.vid .vw a{color:var(--gold);margin-left:8px}
.note{padding:0 16px 14px;color:var(--muted);font-size:12px}

</style>
</head>

const START = 11*60, END = 22*60;

function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', +b.dataset.day === day));
  const H = (END-START), ppm = 'var(--ppm)';
  let heads = '<div></div>' + STAGES.map((s,i)=>`<div style="color:var(--c${i})"><div class="zh">${s.zh}</div><div class="en">${s.en}</div></div>`).join('') + '<div></div>';
  let lines = '';
  for (let m = START; m <= END; m += 30) lines += `<div class="${m%60?'half':''}" style="top:calc(${m-START} * ${ppm})"></div>`;
  const tcol = () => { let s=''; for (let m=START; m<=END; m+=60) s += `<span style="top:calc(${m-START} * ${ppm})">${String(m/60).padStart(2,'0')}:00</span>`; return `<div class="tcol" style="height:calc(${H} * ${ppm})">${s}</div>`; };
  let cols = '';
  for (let s = 0; s < 7; s++) {
    const blks = DATA.filter(it => it.day === day && it.stage === s).map(it => {
      const top = mins(it.start)-START, h = mins(it.end)-mins(it.start);
      const clickable = it.vids && it.vids.length;
      const tag = clickable ? 'button' : 'div';
      const disp = it.label || dispName(it.name);
      const cls = ['blk', clickable?'':'off', it.small?'small':'', (!it.label && it.name.split(' ft. ')[0].length > 10)?'long':'', want.has(key(it))?'want':''].join(' ');
      return `<${tag} class="${cls}" data-k="${encodeURIComponent(key(it))}" style="top:calc(${top} * ${ppm} + 2px);height:calc(${h} * ${ppm} - 4px);background:var(--c${s})"><span class="nm">${disp}</span><span class="tm">${it.start}-${it.end}</span></${tag}>`;

  if (e.target.closest('a')) return;
  const li = e.target.closest('.vid'); if (!li) return;
  document.querySelectorAll('.vid').forEach(x => x.classList.toggle('playing', x === li));
  $('#player').className = 'player on';
  $('#player').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${li.dataset.id}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
});
$('#dWant').onclick = () => { const k = key(cur); want.has(k) ? want.delete(k) : want.add(k); save(); syncWant(); render(); };
$('#dCopy').onclick = async () => { try { await navigator.clipboard.writeText(cur.name); $('#dCopy').textContent = '已複製 ✓'; } catch(e) { $('#dCopy').textContent = '複製失敗'; } setTimeout(()=>$('#dCopy').textContent='複製團名',1200); };
const close = () => { $('#player').innerHTML = ''; $('#dlg').close(); };
$('#dClose').onclick = close;
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) close(); });
$('#dlg').addEventListener('close', () => { $('#player').innerHTML = ''; });
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { day = +b.dataset.day; try { localStorage.setItem('vf26-day', day); } catch(e) {} render(); });
$('#onlyWant').onclick = () => { const on = $('#onlyWant').getAttribute('aria-pressed') !== 'true'; $('#onlyWant').setAttribute('aria-pressed', on); $('#main').classList.toggle('dim', on); };
let view = 'grid';
try { view = localStorage.getItem('vf26-view2') || view; } catch(e) {}
const setView = v => { view = v; document.body.classList.toggle('mode-list', v === 'list'); requestAnimationFrame(fit);
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); try { localStorage.setItem('vf26-view2', v); } catch(e) {} };
document.querySelectorAll('.views button').forEach(b => b.onclick = () => setView(b.dataset.v));
setView(view);
const DESIGN_W = 780;
function fit(){
  const b = $('#board'), cw = $('.scroller').clientWidth;
  if (cw && cw < DESIGN_W) { b.style.width = DESIGN_W + 'px'; b.style.zoom = cw / DESIGN_W; }
  else { b.style.width = ''; b.style.zoom = ''; }
}
addEventListener('resize', fit);
render(); fit();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {/* 本機 file:// 開啟會失敗，忽略 */});
</script>
</body>
